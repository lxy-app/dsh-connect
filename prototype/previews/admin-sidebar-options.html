<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH Connect · 管理后台侧栏视觉预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8e9ee;color:#1b1c24;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.intro{padding:25px 30px 18px;max-width:1600px;margin:auto}.intro h1{margin:0;font-size:21px}.intro p{margin:8px 0 0;font-size:13px;color:#575d6d;line-height:1.6}.toolbar{display:flex;gap:10px;margin-top:16px}.toolbar button{border:1px solid #cbd0dc;border-radius:8px;background:#fff;padding:8px 17px;color:#252639;cursor:pointer}.toolbar button.active{background:#625bf6;border-color:#625bf6;color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;padding:0 30px 35px;max-width:1600px;margin:auto}.option{min-width:0}.option-title{display:flex;align-items:baseline;gap:10px;margin:0 0 9px;font-size:15px;font-weight:700}.option-title small{font-size:12px;font-weight:400;color:#575d6d}.window{height:720px;display:flex;overflow:hidden;border:1px solid #dfe1e8;border-radius:14px;background:#f4f5f9;box-shadow:0 14px 34px #24213814;--primary:#625bf6;--primary-bg:#eeedff;--text:#181a22;--secondary:#686d80;--line:#e5e6ed;--surface:#fff;--layout:#f4f5f9;--nav:#596071;--hover:#f5f4ff}.window.dark{--primary:#928bff;--primary-bg:#322f51;--text:#f2f2f5;--secondary:#a6a7b5;--line:#353641;--surface:#22232b;--layout:#17181e;--nav:#b4b5c3;--hover:#292a36;background:var(--layout);border-color:#3c3d49}.sidebar{width:224px;flex:0 0 224px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;color:var(--text)}.brand{display:flex;gap:10px;align-items:center;min-height:77px;padding:13px 20px;border-bottom:1px solid var(--line)}.brand img{height:32px;width:32px;border-radius:10px}.brand b{display:block;font-size:14px}.brand small{display:block;margin-top:3px;color:var(--secondary);font-size:10px;letter-spacing:.45px}.nav{padding:13px 10px;flex:1}.group{margin:15px 0 6px 11px;font-size:10px;font-weight:700;letter-spacing:1.1px;color:var(--secondary)}.group:first-child{margin-top:5px}.item{height:42px;border-radius:9px;display:flex;align-items:center;gap:12px;padding:0 12px;margin:2px 0;color:var(--nav);font-size:13px;font-weight:500;position:relative}.item svg{width:17px;height:17px;flex:0 0 17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.item.active{background:var(--primary-bg);color:var(--primary);font-weight:650}.item:hover:not(.active){background:var(--hover)}.foot{border-top:1px solid var(--line);margin:0 18px;padding:15px 0 17px;color:var(--secondary);font-size:11px}.option-b .sidebar{background:var(--layout)}.option-b .brand{border:0}.option-b .nav{padding-left:13px;padding-right:13px}.option-b .item{border-radius:11px}.option-b .item.active{background:var(--surface);box-shadow:0 3px 12px #29233a0d;color:var(--primary)}.option-b .item.active:before{content:"";position:absolute;left:0;top:11px;height:20px;width:3px;background:var(--primary);border-radius:3px}.option-b.dark .item.active{background:var(--primary-bg);box-shadow:none}.option-b .group{margin-top:21px}.option-b .foot{border:0}.main{flex:1;min-width:0;background:var(--layout);color:var(--text)}.header{height:64px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 20px;display:flex;align-items:center;gap:11px;font-size:16px;font-weight:650}.header .hamburger{color:var(--secondary);font-size:18px}.header .right{margin-left:auto;display:flex;align-items:center;gap:13px;color:var(--secondary);font-size:12px;font-weight:400}.avatar{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--primary-bg);color:var(--primary);font-weight:700}.content{padding:24px}.content h2{font-size:19px;margin:0 0 4px}.content p{font-size:12px;color:var(--secondary);margin:0 0 22px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:17px}.card small{color:var(--secondary);font-size:12px}.card strong{display:block;font-size:27px;margin-top:12px}.wide{height:174px;margin-top:12px}.bars{height:78px;display:flex;gap:10px;align-items:end;margin-top:14px}.bars i{flex:1;background:var(--primary-bg);border-radius:4px 4px 0 0;height:50%}.bars i:nth-child(2){height:72%}.bars i:nth-child(3){height:38%}.bars i:nth-child(4){height:94%;background:var(--primary)}.bars i:nth-child(5){height:61%}.bars i:nth-child(6){height:83%}.bars i:nth-child(7){height:67%}.note{padding:0 3px;margin:10px 0 0;font-size:12px;line-height:1.5;color:#575d6d}@media(max-width:950px){.grid{grid-template-columns:1fr}.window{height:690px}}@media(max-width:520px){.grid{padding:0 12px 25px}.intro{padding:16px}.sidebar{width:190px;flex-basis:190px}.main{display:none}}
</style>
</head>
<body>
<div class="intro"><h1>管理后台侧栏 · 视觉方案对比</h1><p>独立静态预览，内容为示意数据。两套方案均保持现有 8 个入口、品牌紫色与顶部账号位置；只改变导航分组、留白与选中态。下方可切换浅色/深色。</p><div class="toolbar"><button id="light" class="active" type="button">浅色</button><button id="dark" type="button">深色</button></div></div>
<div class="grid" id="grid"></div>
<script>
const icons={overview:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',running:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 14l3-3 3 3 4-5"/>',approvals:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 11l2 2 5-5M8 17h8"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 7a3 3 0 0 1 0 6M17 15a5 5 0 0 1 4 5"/>',devices:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',policies:'<path d="M12 2l8 4v6c0 5-3 8-8 10-5-2-8-5-8-10V6zM9 12l2 2 4-4"/>',audit:'<path d="M7 3h10l3 3v15H4V3zM8 10h8M8 14h8M8 18h5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
const groups=[['工作台',[['overview','概览'],['running','运行会话'],['approvals','远程审批']]],['资源与权限',[['users','用户与角色'],['devices','设备管理'],['policies','访问策略']]],['系统',[['audit','审计日志'],['settings','系统设置']]]];
const grid=document.getElementById('grid');
function render(mode){document.getElementById('light').classList.toggle('active',mode==='light');document.getElementById('dark').classList.toggle('active',mode==='dark');grid.innerHTML=[['a','方案 A · 轻量分组','保留白色侧栏，增加分组与清晰的选中态。改动更克制。'],['b','方案 B · 柔和侧栏','侧栏与页面同底色，选中项提升为卡片；层次更强。']].map(([id,title,detail])=>`<section class="option"><div class="option-title">${title}<small>${mode==='light'?'浅色':'深色'}</small></div><div class="window option-${id} ${mode==='dark'?'dark':''}"><aside class="sidebar"><div class="brand"><img src="../../apps/admin/src/assets/app-icon.png" alt=""><span><b>DSH Connect</b><small>CONTROL CENTER</small></span></div><nav class="nav">${groups.map(([label,items])=>`<div class="group">${label}</div>${items.map(([key,name])=>`<div class="item ${key==='overview'?'active':''}"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[key]}</svg><span>${name}</span></div>`).join('')}`).join('')}</nav><div class="foot">DSH CONNECT · ADMIN</div></aside><main class="main"><div class="header"><span class="hamburger">☰</span>概览<div class="right"><span>☾</span><span class="avatar">管</span><span>管理员</span></div></div><div class="content"><h2>概览</h2><p>设备、会话、指令与待处理交互快照；可手动刷新获取最新数据</p><div class="stats"><div class="card"><small>在线桌面</small><strong>8 / 10</strong></div><div class="card"><small>活跃会话</small><strong>12</strong></div><div class="card"><small>今日指令</small><strong>286</strong></div><div class="card"><small>待处理审批 / 提问</small><strong>3</strong></div></div><div class="card wide"><small>近 7 日指令趋势</small><div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div></main></div><p class="note">${detail}</p></section>`).join('')}
render('light');document.getElementById('light').onclick=()=>render('light');document.getElementById('dark').onclick=()=>render('dark');
</script>
</body></html>
