<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH Connect · WorkBuddy 风格会话页预览</title>
<style>
:root{
  --background:#1A1A1A;
  --surface:#242424;
  --surface-muted:#303030;
  --text:#F2F2F2;
  --secondary:#9C9C9C;
  --border:#333333;
  --accent:#F4F6F8;
  --accent-soft:#353B43;
  --bubble:#383838;
  --neutral:#8E8E8E;
  --warning-soft:#352A14;
  --warning:#F0BF68;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  font-synthesis:none;
}
*{box-sizing:border-box}
html,body{margin:0;width:390px;height:844px;background:var(--background)}
body{display:flex;flex-direction:column;color:var(--text);overflow:hidden}
.status{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 7px;font-size:13px;font-weight:650;letter-spacing:-.1px}
.status-icons{display:flex;align-items:center;gap:6px}
.status-icons svg{display:block}

.head{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:10px 16px}
.icon-button{width:36px;height:36px;flex:0 0 36px;border:1px solid var(--border);border-radius:11px;background:var(--surface);display:grid;place-items:center;color:var(--text);font-size:25px;line-height:27px}
.icon-button .glyph{margin-top:-3px}
.icon-button.accent{color:var(--accent);font-size:21px;font-weight:600}
.head-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chat-title{font-size:16px;line-height:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-subtitle{font-size:12px;line-height:18px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{border-radius:999px;padding:3px 9px;background:var(--surface-muted);color:var(--secondary);font-size:12px;line-height:18px;font-weight:600;white-space:nowrap}

.messages{flex:1;min-height:0;padding:8px 16px 18px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.turn{display:flex;flex-direction:column}
.time-divider{align-self:center;font-size:12px;line-height:17px;color:var(--neutral);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.user-row{display:flex;justify-content:flex-end}
.user-bubble{max-width:80%;padding:10px 16px;border-radius:20px;background:var(--bubble);color:#F2F2F2;font-size:16px;line-height:24px;white-space:pre-wrap}
.turn-card{margin-top:10px;margin-bottom:6px}
.turn-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.turn-head{display:flex;align-items:center;gap:6px;padding:8px 0;color:var(--secondary);align-self:flex-start}
.turn-title{font-size:15px;line-height:21px;font-weight:600}
.chevron{font-size:17px;line-height:18px}

.compose-box{min-height:50px;border-radius:27px;background:var(--surface-muted);padding:6px 8px;display:flex;align-items:center;gap:8px}
.voice-button{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;color:var(--accent)}

.compose-placeholder{flex:1;padding:0 4px;color:var(--secondary);font-size:16px;line-height:24px}
.more{width:38px;height:38px;display:grid;place-items:center;color:var(--text);font-size:25px;font-weight:500}

.tabbar{flex:0 0 66px;border-top:1px solid var(--border);background:var(--background);display:flex;padding:6px 0 10px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--secondary);font-size:12px;line-height:18px;font-weight:500}
.tab.on{color:var(--accent);font-weight:600}
