name: Deploy Website

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only; do not connect to the production host
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  verify:
    name: Build and Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm --prefix website ci --no-audit --no-fund

      - name: Run Website checks
        run: npm --prefix website run check

      - name: Build and verify static output
        run: npm --prefix website run build

      - name: Record dry-run result
        if: inputs.dry_run
        run: |
          echo 'Dry-run only: the production host was not contacted.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy Production Website
    if: inputs.dry_run == false
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-website
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a successful CI Gate on this commit
        run: bash scripts/ci/verify-ci-gate.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm --prefix website ci --no-audit --no-fund

      - name: Configure dedicated SSH credentials
        run: |
          : "${WEBSITE_REMOTE:?WEBSITE_REMOTE secret is required}"
          : "${WEBSITE_REMOTE_DIR:?WEBSITE_REMOTE_DIR secret is required}"
          : "${WEBSITE_BACKUP_DIR:?WEBSITE_BACKUP_DIR secret is required}"
          : "${WEBSITE_SSH_PRIVATE_KEY:?WEBSITE_SSH_PRIVATE_KEY secret is required}"
          : "${WEBSITE_SSH_HOST_KEY:?WEBSITE_SSH_HOST_KEY secret is required}"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$WEBSITE_SSH_PRIVATE_KEY" > "$WEBSITE_SSH_KEY"
          printf '%s\n' "$WEBSITE_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$WEBSITE_SSH_KEY" "$HOME/.ssh/known_hosts"
        env:
          WEBSITE_REMOTE: ${{ secrets.WEBSITE_REMOTE }}
          WEBSITE_REMOTE_DIR: ${{ secrets.WEBSITE_REMOTE_DIR }}
          WEBSITE_BACKUP_DIR: ${{ secrets.WEBSITE_BACKUP_DIR }}
          WEBSITE_SSH_PRIVATE_KEY: ${{ secrets.WEBSITE_SSH_PRIVATE_KEY }}
          WEBSITE_SSH_HOST_KEY: ${{ secrets.WEBSITE_SSH_HOST_KEY }}
          WEBSITE_SSH_KEY: /home/runner/.ssh/dsh_connect_website

      - name: Back up and deploy static site
        run: make website-deploy
        env:
          WEBSITE_REMOTE: ${{ secrets.WEBSITE_REMOTE }}
          WEBSITE_REMOTE_DIR: ${{ secrets.WEBSITE_REMOTE_DIR }}
          WEBSITE_BACKUP_DIR: ${{ secrets.WEBSITE_BACKUP_DIR }}
          WEBSITE_SSH_KEY: /home/runner/.ssh/dsh_connect_website

      - name: Verify deployed Website
        run: bash scripts/ci/website-smoke.sh

      - name: Remove deployment private key
        if: always()
        run: rm -f /home/runner/.ssh/dsh_connect_website
