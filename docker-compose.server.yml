# Production deployment using PostgreSQL 18 (default) or single-instance SQLite.
# Required settings in .env include DSH_CONNECT_BOOTSTRAP_TOKEN,
# DSH_CONNECT_DATABASE_URL and the bootstrap Owner credentials. For SQLite use
# sqlite:///data/sqlite/dsh-connect.db and keep the dsh-connect-sqlite volume.
services:
  server:
    image: lxyapp/dsh-connect:latest
    container_name: dsh-connect
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The local development .env may use 127.0.0.1; that would make the
      # published container port unreachable, so always override it here.
      DSH_CONNECT_LISTEN_ADDR: 0.0.0.0:8787
      DSH_CONNECT_ATTACHMENT_DIR: /data/attachments
    ports:
      - "${DSH_CONNECT_HTTP_PORT:-8787}:8787"
    volumes:
      # A host bind mount such as ./data/attachments:/data/attachments must be
      # owned by UID/GID 10001; the container runs as the unprivileged app user.
      - dsh-connect-attachments:/data/attachments
      # Only used when DSH_CONNECT_DATABASE_URL selects SQLite. Keep the
      # database on a local Docker volume; do not use a network filesystem.
      - dsh-connect-sqlite:/data/sqlite
    extra_hosts:
      # Allows DSH_CONNECT_DATABASE_URL to reach PostgreSQL on the Docker host
      # via host.docker.internal. A remote database can use its DNS name or IP.
      - "host.docker.internal:host-gateway"

volumes:
  dsh-connect-attachments:
  dsh-connect-sqlite:
